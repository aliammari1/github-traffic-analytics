# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/app/api/**"
      instructions: >-
        Flag missing auth checks, unvalidated input, and any access-token or
        secret that could be logged or leaked to the client.
    - path: "worker/**"
      instructions: >-
        This runs on Cloudflare Workers. Flag Node-only APIs and ensure GitHub
        tokens are never logged.
chat:
  auto_reply: true
