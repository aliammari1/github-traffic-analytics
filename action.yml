name: GitHub Traffic Analytics Lite
description: Archive completed GitHub traffic days to a data branch without a hosted database.
branding:
  icon: activity
  color: blue
inputs:
  traffic_token:
    description: GitHub App installation token or fine-grained token with Administration read on this repository.
    required: true
  github_token:
    description: Token with Contents write on this repository for the archive branch.
    required: true
  branch:
    description: Branch that stores traffic history.
    required: false
    default: traffic-history
  path_prefix:
    description: Directory in the archive branch that stores data files.
    required: false
    default: data
  allow_public_archive:
    description: Explicitly allow archiving private traffic counts in a public repository branch.
    required: false
    default: "false"
outputs:
  branch:
    description: Branch containing the archive.
  latest_day:
    description: Latest complete UTC day archived.
  observed_days:
    description: Number of distinct UTC days in the archive.
runs:
  using: node24
  main: action/index.mjs
