# SPDX-License-Identifier: MIT
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release automation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit
      - name: Release automation disabled
        if: ${{ vars.RELEASE_PLEASE_ENABLED != 'true' }}
        run: |
          echo "Release Please is opt-in because it creates pull requests."
          echo "Set RELEASE_PLEASE_ENABLED=true after enabling Actions PR creation"
          echo "or configuring a RELEASE_PLEASE_TOKEN with repository write access."
      - name: Run Release Please
        if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
