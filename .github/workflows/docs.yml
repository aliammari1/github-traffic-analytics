# SPDX-License-Identifier: MIT
# Builds the Nextra docs site and (when Cloudflare creds are configured) deploys
# it to Cloudflare Pages. The build always runs on PRs to catch broken docs.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Build Nextra site
        working-directory: docs
        # --ignore-workspace: the docs site is a standalone project nested in the repo.
        run: |
          pnpm install --ignore-workspace --no-frozen-lockfile
          pnpm build
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'push' && vars.ENABLE_CF_DEPLOY == 'true' }}
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/out --project-name=github-traffic-analytics-docs
