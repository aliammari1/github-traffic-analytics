# SPDX-License-Identifier: MIT
name: Feature request
description: Suggest an idea for GitHub Traffic Analytics
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false
